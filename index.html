<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Oblique Strategies</title>
<meta name="description" content="A random Oblique Strategy on every page load.">
<style>
  :root {
    --table: #a4a3a1;
    --card: #f5f4f1;
    --ink: #0b0b0b;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overscroll-behavior: none; }
  body {
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
  }
  ::selection { background: transparent; }
  body { min-height: 100vh; min-height: 100dvh; }

  body {
    background: var(--table);
    background-image: radial-gradient(120% 90% at 50% 30%, #b3b2b0, #8e8d8b);
    color: var(--ink);
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    font-kerning: normal;
    font-feature-settings: "kern" 1, "liga" 1, "calt" 1;
    text-rendering: optimizeLegibility;
    -webkit-font-smoothing: antialiased;
    display: grid;
    place-items: center;
    padding: 24px;
  }

  .stack { width: min(100%, 640px); }

  /* Card: plain stock, rounded corners, small centered sans text */
  .stack { position: relative; }
  .card, .sheet { cursor: grab; }
  .card:active, .sheet:active { cursor: grabbing; }

  /* Paper: one soft shadow and a faint edge highlight */
  .card, .sheet {
    aspect-ratio: 3 / 2;
    background: linear-gradient(160deg, #fbfaf7 0%, var(--card) 60%, #ebeae6 100%);
    border-radius: clamp(14px, 3vw, 22px);
    box-shadow: 0 1px 0 #fff inset, 0 6px 14px -4px #14141159;
  }
  .card {
    position: relative;
    z-index: 4;
    display: grid;
    place-items: center;
    padding: clamp(24px, 7vw, 64px);
    user-select: none;
  }

  /* Cards waiting underneath */
  .sheet { position: absolute; inset: 0; }
  .s1 { z-index: 3; transform: translate(0, 9px) rotate(.5deg); }
  .s2 { z-index: 2; transform: translate(-3px, 18px) rotate(-.8deg); }
  .s3 { z-index: 1; transform: translate(4px, 27px) rotate(1.1deg); }

  h1 {
    position: relative;
    z-index: 1;
    font-weight: 400;
    font-size: clamp(1.3rem, 3.6vw, 1.875rem);
    line-height: 1.3;
    letter-spacing: -0.01em;
    font-kerning: normal;
    font-variant-ligatures: common-ligatures;
    font-feature-settings: "kern" 1, "liga" 1;
    text-align: center;
    text-wrap: balance;
    max-width: 26ch;
  }

  #num { display: none; }
</style>
</head>
<body>
  <div class="stack">
    <div class="sheet s3"></div><div class="sheet s2"></div><div class="sheet s1"></div>
    <div class="card" id="card" title="Draw another card"><h1 id="strategy" aria-live="polite"></h1></div>
    <span id="num"></span>
  </div>

<script>

    "Ask people to work against their better judgement",
    "Ask your body",
    "Balance the consistency principle with the inconsistency principle",
    "Be dirty",
    "Be extravagant",
    "Be less critical",
    "Breathe more deeply",
    "Bridges - build - burn",
    "Cascades",
    "Change ambiguities to specifics",
    "Change instrument roles",
    "Change nothing and continue consistently",
    "Change specifics to ambiguities",
    "Children - speaking - singing",
    "Cluster analysis",
    "Consider different fading systems",
    "Consider transitions",
    "Consult other sources - promising - unpromising",
    "Convert a melodic element into a rhythmic element",
    "Courage!",
    "Cut a vital connection",
    "Decorate, decorate",
    "Destroy nothing; Destroy the most important thing",
    "Discard an axiom",
    "Disciplined self-indulgence",
    "Discover your formulas and abandon them",
    "Display your talent",
    "Distort time",
    "Do nothing for as long as possible",
    "Do something boring",
    "Do something sudden, destructive and unpredictable",
    "Do the last thing first",
    "Do the washing up",
    "Do the words need changing?",
    "Do we need holes?",
    "Don't avoid what is easy",
    "Don't break the silence",
    "Don't stress one thing more than another",
    "Emphasize differences",
    "Emphasize repetitions",
    "Emphasize the flaws",
    "Faced with a choice, do both",
    "Feed the recording back out of the medium",
    "Fill every beat with something",
    "Find a safe part and use it as an anchor",
    "From nothing to more than nothing",
    "Get your neck massaged",
    "Ghost echoes",
    "Give the name away",
    "Give way to your worst impulse",
    "Go outside. Shut the door.",
    "Go slowly all the way round the outside",
    "Go to an extreme, come part way back",
    "How would someone else do it?",
    "How would you have done it?",
    "Idiot glee",
    "Imagine the piece as a set of disconnected events",
    "In total darkness, or in a very large room, very quietly",
    "Infinitesimal gradations",
    "Intentions - nobility of - humility of - credibility of",
    "Into the impossible",
    "Is it finished?",
    "Is something missing?",
    "Is the intonation correct?",
    "Is the style right?",
    "It is quite possible (after all)",

    "Mute and continue",
    "Not building a wall; making a brick",
    "Once the search has begun, something will be found",
    "Only a part, not the whole",
    "Only one element of each kind",
    "Openly resist change",
    "(Organic) machinery",
    "Put in earplugs",
    "Question the heroic",
    "Reevaluation (a warm feeling)",
    "Remember quiet evenings",
    "Remove a restriction",
    "Repetition is a form of change",
    "Retrace your steps",
    "Reverse",

    "Simple subtraction",
    "Slow preparation, fast execution",
    "Spectrum analysis",
    "State the problem as clearly as possible",
    "Take a break",
    "Take away the important parts",
    "Tape your mouth",
    "The inconsistency principle",
    "The most easily forgotten thing is the most important",
    "The tape is now the music",
    "Think - inside the work - outside the work",
    "Think of the radio",
    "Tidy up",
    "Trust in the you of now",
    "Try faking it",
    "Turn it upside down",
    "Twist the spine",
    "Use “unqualified” people",
    "Use an old idea",
    "Use an unacceptable color",
    "Use cliches",
    "Use fewer notes",
    "Use filters",
    "Use something nearby as a model",
    "Use your own ideas",
    "Voice your suspicions",
    "Water",
    "What are the sections sections of? Imagine a caterpillar moving",
    "What are you really thinking about just now?",
    "What context would look right?",
    "What is the reality of the situation?",
    "What is the simplest solution?",
    "What mistakes did you make last time?",
    "What to increase? What to reduce? What to maintain?",
    "What would your closest friend do?",
    "What wouldn't you do?",
    "When is it for?",
    "Where is the edge?",
    "Which parts can be grouped?",
    "Work at a different speed",
    "Would anyone want it?",
    "You are an engineer",
    "You can only make one dot at a time",
    "Your mistake was a hidden intention"
  ];

  document.querySelector(".stack").addEventListener("click", function () { location.reload(); });
  (function () {
    // Pick a random strategy, avoiding an immediate repeat of the last one shown.
    let last = -1;
    try { last = parseInt(sessionStorage.getItem("os:last"), 10); } catch (e) {}
    let i;
    do {
      i = Math.floor(Math.random() * STRATEGIES.length);
    } while (i === last && STRATEGIES.length > 1);
    try { sessionStorage.setItem("os:last", String(i)); } catch (e) {}

    document.getElementById("strategy").textContent = STRATEGIES[i];
    document.getElementById("num").textContent =
      "No. " + String(i + 1).padStart(3, "0") + " / " + STRATEGIES.length;
  })();
</script>
</body>
</html>
