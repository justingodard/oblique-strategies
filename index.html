<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Oblique Strategies</title>
<meta name="description" content="A random Oblique Strategy on every page load.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..700&display=block" rel="stylesheet">
<style>
  :root {
    --table: #a4a3a1;
    --card: #f5f4f1;
    --ink: #333333;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  /* Cards are thrown off-screen; never let that widen or scroll the page. */
  html, body { height: 100%; overscroll-behavior: none; overflow: hidden; }
  body {
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
  }
  ::selection { background: transparent; }
  body { min-height: 100vh; min-height: 100dvh; }

  body {
    background: var(--table);
    background-image: radial-gradient(120% 90% at 50% 30%, #b3b2b0, #8e8d8b);
    color: var(--ink);
    font-family: "Helvetica Neue", "Inter", Helvetica, Arial, sans-serif;
    font-kerning: normal;
    font-feature-settings: "kern" 1, "liga" 1, "calt" 1;
    text-rendering: optimizeLegibility;
    -webkit-font-smoothing: antialiased;
    display: grid;
    place-items: center;
    padding: 24px;
  }

  .stack { width: min(100%, 640px); }

  /* Card: plain stock, rounded corners, small centered sans text */
  /* Nudged up by half the pile's depth so card and pile together are centred.
     (top, not transform: the labels inside are position: fixed.) */
  .stack {
    position: relative; top: var(--lift, 0px); transition: top 300ms ease;
    /* one text size for the title card and every strategy: 4.2% of the card width */
    --fs: max(calc(var(--cw, 640px) * 0.042), 13px);
  }
  .card { cursor: grab; touch-action: none; -webkit-user-drag: none; }
  .card:active { cursor: grabbing; }

  /* Paper */
  .card, .sheet {
    background: linear-gradient(160deg, #fbfaf7 0%, var(--card) 60%, #ebeae6 100%);
    border-radius: clamp(14px, 3vw, 22px);
  }
  .card, .sheet.peek {
    display: grid;
    place-items: center;
    padding: clamp(24px, 7vw, 64px);
  }

  .card {
    aspect-ratio: 3 / 2;
    position: relative;
    top: var(--drop, 0px);   /* the pile loses cards from the top, so the top card settles lower */
    z-index: 4;
    user-select: none;
    box-shadow: 0 1px 0 #fff inset, 0 6px 14px -4px #14141159;
    transform: rotate(var(--tilt, 0deg));
    animation: land 380ms cubic-bezier(.2, .8, .25, 1) backwards;
  }

  /* The cards still in the deck: one layer per ~3 cards, shrinking as you draw */
  .pile {
    position: absolute;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    z-index: 1;
    pointer-events: none;
  }
  .sheet {
    position: absolute;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    box-shadow: 0 1px 0 #fff inset, 0 1px 0 #5a584f47;
    transform: translate(var(--dx, 0px), var(--dy, 0px)) rotate(var(--rot, 0deg));
    transition: opacity 260ms ease, visibility 260ms;
    animation: fan 520ms cubic-bezier(.2, .8, .25, 1) backwards;
  }
  .sheet.gone { opacity: 0; visibility: hidden; }
  /* Only the bottom layer of the pile casts a soft shadow */
  .sheet.last { box-shadow: 0 1px 0 #fff inset, 0 1px 0 #5a584f47, 0 6px 12px -4px #14141166; }

  @keyframes fan {
    from { transform: translate(0, 0) rotate(0deg); }
  }
  @keyframes land {
    from { transform: translateY(-14px) rotate(calc(var(--tilt, 0deg) + var(--land, .6deg))); }
  }
  @media (prefers-reduced-motion: reduce) {
    .sheet, .card, .stack { animation: none; transition: none; }
  }

  h1 {
    position: relative;
    z-index: 1;
    font-weight: 400;
    font-size: var(--fs);
    line-height: 1.3;
    letter-spacing: -0.01em;
    font-kerning: normal;
    font-variant-ligatures: common-ligatures;
    font-feature-settings: "kern" 1, "liga" 1;
    text-align: center;
    text-wrap: balance;
    max-width: 26ch;
  }

  /* The title card, sized from measurements of the printed card. One unit, s, is 4.2% of
     the card width, the same size as the strategy text: title, subtitle and names 1s,
     copyright 0.75s. Line gaps are
     the photo's, corrected for camera foreshortening. The names sit midway between the subtitle
     and the copyright line, and the space above the title equals the space below the copyright. */
  .card.intro {
    place-items: start center;
    padding: calc(var(--cw, 640px) * 0.1281) calc(var(--cw, 640px) * 0.03) 0;
  }
  .card.intro h1 {
    font-size: var(--fs);
    line-height: 1.2;
    letter-spacing: 0;
    max-width: none;
    width: 100%;
    text-wrap: initial;
  }
  .card.intro h1 span { display: block; }
  .t-title { font-weight: 700; text-transform: uppercase; letter-spacing: 0.02em; }
  .t-sub { margin-top: 0.35em; }
  .t-by { margin-top: 2.33em; text-transform: uppercase; }
  .t-by i { font-style: normal; text-transform: none; }
  .bl { display: inline-block; width: 0; height: 0; }
  .t-fine { font-size: 0.746em; margin-top: 3.21em; }

  /* Small grey labels: title at the top, position in the deck at the bottom */
  #num, #title {
    position: fixed;
    left: 0;
    right: 0;
    text-align: center;
    font-size: 14px;
    letter-spacing: 0.02em;
    font-feature-settings: "tnum" 1, "kern" 1;
    color: #4d4c4a;
    pointer-events: none;
  }
  /* Tap the number to copy this card's link. Padding makes a comfortable touch target;
     the offset cancels it so the numerals stay where they were. */
  #num {
    bottom: calc(max(20px, env(safe-area-inset-bottom)) - 12px);
    left: 50%;
    right: auto;
    width: max-content;
    transform: translateX(-50%);
    padding: 12px 18px;
    pointer-events: auto;
    cursor: pointer;
    user-select: none;
    -webkit-user-select: none;
  }
  #num:empty, body.ended #num { pointer-events: none; }
  /* Tap the title to start over. The padding makes a comfortable touch target without
     moving the words: it is cancelled by the offset on top. */
  #title {
    top: calc(max(20px, env(safe-area-inset-top)) - 12px);
    left: 50%;
    right: auto;
    width: max-content;
    transform: translateX(-50%);
    padding: 12px 18px;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    pointer-events: auto;
    cursor: pointer;
    user-select: none;
    -webkit-user-select: none;
    transition: color 150ms ease, opacity 500ms ease;
  }
  #title:hover { color: #1f1e1d; }


  /* The finale: after the last card is thrown, the table is left bare */
  .stack .card, .pile, #num, #title { transition: opacity 500ms ease; }
  body.single .pile { opacity: 0; }                      /* a shared card stands alone */
  body.ended .card:not(.flyer), body.ended .pile, body.ended #num { opacity: 0; }   /* the header stays */
  @media (prefers-reduced-motion: reduce) { .stack .card, .pile, #num, #title { transition: none; } }
</style>
</head>
<body>
  <div class="stack">
    <div class="pile" id="pile" aria-hidden="true"></div>
    <div class="card" id="card" role="button" tabindex="0" aria-label="Draw the next card" title="Drag, flick or tap to draw"><h1 id="strategy" aria-live="polite"></h1></div>
    <span id="num"></span>
    <span id="title" role="button" tabindex="0" aria-label="Start over" title="Start over">Oblique Strategies</span>
  </div>

<script>
  // Source: "Visual Arts: Oblique Strategies Dartboard" (147 statements).
  const STRATEGIES = [
    "A line has two sides",
    "A very small object. Its center",
    "Abandon desire",
    "Abandon normal instructions",
    "Accept advice",
    "Adding on",
    "Always give yourself credit for having more than personality",
    "Always the first steps",
    "Ask people to work against their better judgement",
    "Ask your body",
    "Balance the consistency principle with the inconsistency principle",
    "Be dirty",
    "Be extravagant",
    "Be less critical",
    "Breathe more deeply",
    "Bridges - build - burn",
    "Cascades",
    "Change ambiguities to specifics",
    "Change instrument roles",
    "Change nothing and continue consistently",
    "Change specifics to ambiguities",
    "Children - speaking - singing",
    "Cluster analysis",
    "Consider different fading systems",
    "Consider transitions",
    "Consult other sources - promising - unpromising",
    "Convert a melodic element into a rhythmic element",
    "Courage!",
    "Cut a vital connection",
    "Decorate, decorate",
    "Destroy nothing; Destroy the most important thing",
    "Discard an axiom",
    "Disciplined self-indulgence",
    "Discover your formulas and abandon them",
    "Display your talent",
    "Distort time",
    "Do nothing for as long as possible",
    "Do something boring",
    "Do something sudden, destructive and unpredictable",
    "Do the last thing first",
    "Do the washing up",
    "Do the words need changing?",
    "Do we need holes?",
    "Don't avoid what is easy",
    "Don't break the silence",
    "Don't stress one thing more than another",
    "Emphasize differences",
    "Emphasize repetitions",
    "Emphasize the flaws",
    "Faced with a choice, do both",
    "Feed the recording back out of the medium",
    "Fill every beat with something",
    "Find a safe part and use it as an anchor",
    "From nothing to more than nothing",
    "Get your neck massaged",
    "Ghost echoes",
    "Give the name away",
    "Give way to your worst impulse",
    "Go outside. Shut the door.",
    "Go slowly all the way round the outside",
    "Go to an extreme, come part way back",
    "How would someone else do it?",
    "How would you have done it?",
    "Idiot glee",
    "Imagine the piece as a set of disconnected events",
    "In total darkness, or in a very large room, very quietly",
    "Infinitesimal gradations",
    "Intentions - nobility of - humility of - credibility of",
    "Into the impossible",
    "Is it finished?",
    "Is something missing?",
    "Is the intonation correct?",
    "Is the style right?",
    "It is quite possible (after all)",
    "It is simply a matter of work",
    "Just carry on",
    "Left channel, right channel, center channel",
    "Listen to the quiet voice",
    "Look at the order in which you do things",
    "Lost in useless territory",
    "Lowest common denominator",
    "Magnify the most difficult details",
    "Make a blank valuable by putting it in an exquisite frame",
    "Make it more sensual",
    "Make what's perfect more human",
    "Mechanize something idiosyncratic",
    "Move towards the unimportant",
    "Mute and continue",
    "Not building a wall; making a brick",
    "Once the search has begun, something will be found",
    "Only a part, not the whole",
    "Only one element of each kind",
    "Openly resist change",
    "(Organic) machinery",
    "Put in earplugs",
    "Question the heroic",
    "Reevaluation (a warm feeling)",
    "Remember quiet evenings",
    "Remove a restriction",
    "Repetition is a form of change",
    "Retrace your steps",
    "Reverse",
    "Short circuit (example: a man eating peas with the idea that they will improve his virility shovels them straight into his lap)",
    "Simple subtraction",
    "Slow preparation, fast execution",
    "Spectrum analysis",
    "State the problem as clearly as possible",
    "Take a break",
    "Take away the important parts",
    "Tape your mouth",
    "The inconsistency principle",
    "The most easily forgotten thing is the most important",
    "The tape is now the music",
    "Think - inside the work - outside the work",
    "Think of the radio",
    "Tidy up",
    "Trust in the you of now",
    "Try faking it",
    "Turn it upside down",
    "Twist the spine",
    "Use “unqualified” people",
    "Use an old idea",
    "Use an unacceptable color",
    "Use cliches",
    "Use fewer notes",
    "Use filters",
    "Use something nearby as a model",
    "Use your own ideas",
    "Voice your suspicions",
    "Water",
    "What are the sections sections of? Imagine a caterpillar moving",
    "What are you really thinking about just now?",
    "What context would look right?",
    "What is the reality of the situation?",
    "What is the simplest solution?",
    "What mistakes did you make last time?",
    "What to increase? What to reduce? What to maintain?",
    "What would your closest friend do?",
    "What wouldn't you do?",
    "When is it for?",
    "Where is the edge?",
    "Which parts can be grouped?",
    "Work at a different speed",
    "Would anyone want it?",
    "You are an engineer",
    "You can only make one dot at a time",
    "Your mistake was a hidden intention"
  ];

  var TOTAL = STRATEGIES.length;
  var reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var card = document.getElementById("card");
  var stack = document.querySelector(".stack");
  var pile = document.getElementById("pile");
  var textEl = document.getElementById("strategy");
  var numEl = document.getElementById("num");

  var rand = function (a, b) { return a + Math.random() * (b - a); };
  var sign = function () { return Math.random() < 0.5 ? -1 : 1; };
  var clamp = function (v, a, b) { return Math.max(a, Math.min(b, v)); };

  // Shuffled deck: every card appears once before any repeats.
  var deck = [], pos = 0;
  function shuffle(avoidFirst) {
    deck = STRATEGIES.map(function (_, i) { return i; });
    for (var i = deck.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1)), t = deck[i];
      deck[i] = deck[j]; deck[j] = t;
    }
    if (avoidFirst !== undefined && deck[0] === avoidFirst && deck.length > 1) {
      var k = deck.length - 1, t2 = deck[0];
      deck[0] = deck[k]; deck[k] = t2;
    }
    pos = 0;
  }
  shuffle();
  pos = -1; // -1 is the title card, before the first strategy

  // Every card has its own link: the page address is index.html#<number>, using the card's
  // own number from the PDF. Opening such a link shows just that one card, with no pile.
  var single = false, singleIdx = 0;
  function hashNum() {
    var m = /^#(\d{1,3})$/.exec(location.hash), n = m ? parseInt(m[1], 10) : 0;
    return n >= 1 && n <= TOTAL ? n : 0;
  }
  function setHash(n) {                      // keep the address bar on the current card
    try { history.replaceState(null, "", n ? "#" + n : location.pathname + location.search); } catch (e) {}
  }
  if (hashNum()) { single = true; singleIdx = hashNum() - 1; document.body.classList.add("single"); }

  var INTRO_HTML =
    '<span class="t-title"><b class="bl"></b>Oblique Strategies</span>' +
    '<span class="t-sub"><b class="bl"></b>Over one hundred worthwhile dilemmas</span>' +
    '<span class="t-by"><b class="bl"></b>Brian Eno <i>and</i> Peter Schmidt</span>' +
    '<span class="t-fine"><b class="bl"></b>\u00A9 1975 Brian Eno and Peter Schmidt</span>';

  // The pile under the top card. Each layer's wobble is fixed when the page loads
  // (a gentle random walk, so the edge looks like real paper), and the pile only
  // ever loses layers from the bottom as the deck runs down.
  var MAX_LAYERS = 56, STEP = 1;
  var layers = [];
  (function () {
    var dx = rand(-3, 3), rot = rand(-1, 1);
    for (var k = 1; k <= MAX_LAYERS; k++) {
      dx = clamp(dx + rand(-2, 2), -11, 11);
      rot = clamp(rot + rand(-0.45, 0.45), -3, 3);
      var el = document.createElement("div");
      el.className = "sheet";
      el.style.zIndex = String(100 - k);
      el.style.animationDelay = Math.min(k, 12) * 18 + "ms";
      el.style.setProperty("--rot", rot.toFixed(2) + "deg");
      if (k === MAX_LAYERS) el.classList.add("last");
      pile.appendChild(el);
      layers.push({ el: el, dx: dx, dy: k * STEP, rot: rot });
    }
  })();
  // The next card's text is shown on whichever layer is currently the top of the pile.
  var peekEl = document.createElement("h1"), peekLayer = -1;
  function placePeek(i, text) {
    if (i >= 0 && i !== peekLayer) {
      if (peekLayer >= 0) layers[peekLayer].el.classList.remove("peek");
      layers[i].el.classList.add("peek");
      layers[i].el.appendChild(peekEl);
      peekLayer = i;
    }
    peekEl.textContent = text;
  }
  var depth = MAX_LAYERS, topIdx = 0;   // pile depth in layers (continuous) and its top visible layer
  function updateDrop() {
    card.style.setProperty("--drop", single ? "0px" : ((MAX_LAYERS - depth) * STEP * scale).toFixed(2) + "px");
  }

  // Tuned on a phone (card about 342px wide); scale up so a wider card gets a
  // proportionally thicker pile instead of a thin sliver.
  var scale = 1, visibleLayers = MAX_LAYERS;
  // Centre the whole deck (top card plus the full pile) in the page. This depends only on
  // the window size, never on which card is showing, so nothing moves when you draw.
  function lift() {
    if (single) { stack.style.setProperty("--lift", "0px"); return; }   // one card: no pile to balance
    var W = stack.offsetWidth, H = W / 1.5, rad = Math.PI / 180;
    var half = function (deg) {           // half the height a tilted card occupies
      var r = Math.abs(deg) * rad;
      return (H / 2) * Math.cos(r) + (W / 2) * Math.sin(r);
    };
    var top = H / 2 - half(0), bottom = H / 2 + half(0);
    layers.forEach(function (l) {
      var c = H / 2 + l.dy * scale, e = half(l.rot);
      top = Math.min(top, c - e);
      bottom = Math.max(bottom, c + e);
    });
    stack.style.setProperty("--lift", (H / 2 - (top + bottom) / 2).toFixed(1) + "px");
  }
  function fitPile() {
    scale = clamp((stack.offsetWidth || 342) / 342, 1, 2);
    var w = card.offsetWidth, h = card.offsetHeight;
    if (w) stack.style.setProperty("--cw", w + "px");
    if (card.classList.contains("intro")) fitIntro();
    lift();
    layers.forEach(function (l) {
      if (w && h) { l.el.style.width = w + "px"; l.el.style.height = h + "px"; }
      l.el.style.setProperty("--dx", (l.dx * scale).toFixed(2) + "px");
      l.el.style.setProperty("--dy", (l.dy * scale).toFixed(2) + "px");
    });
    updateDrop();
  }
  fitPile();
  window.addEventListener("resize", fitPile);
  if (window.ResizeObserver) new ResizeObserver(fitPile).observe(card);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitPile);

  // Title card spacing, measured from the real letter shapes in whatever font is in use:
  //  - the space above the title equals the space below the copyright line
  //  - the names sit exactly midway between the subtitle and the copyright line
  var meas = document.createElement("canvas").getContext("2d");
  function ink(el, text) {
    var cs = getComputedStyle(el);
    meas.font = cs.fontWeight + " " + cs.fontSize + " " + cs.fontFamily;
    var m = meas.measureText(text);
    return { up: m.actualBoundingBoxAscent, down: Math.max(0, m.actualBoundingBoxDescent) };
  }
  function fitIntro() {
    var q = function (c) { return card.querySelector(c); };
    var title = q(".t-title"), sub = q(".t-sub"), by = q(".t-by"), fine = q(".t-fine");
    if (!title || !fine) return;
    card.style.paddingTop = "";
    fine.style.marginTop = "";
    // Baseline height from the card's top edge, to a fraction of a pixel, with the card's
    // tilt and any running animation undone (rotation is about the card's centre).
    var mt = getComputedStyle(card).transform, sin = 0, cos = 1;
    if (mt && mt !== "none") { var mv = mt.match(/matrix\(([^)]+)\)/)[1].split(",").map(Number); cos = mv[0]; sin = mv[1]; }
    var cr = card.getBoundingClientRect(), cx = cr.left + cr.width / 2, cy = cr.top + cr.height / 2;
    var H = parseFloat(getComputedStyle(card).height);
    var base = function (el) {
      var r = el.querySelector(".bl").getBoundingClientRect();
      return -(r.left - cx) * sin + (r.top - cy) * cos + H / 2;
    };
    var it = ink(title, "OBLIQUE STRATEGIES"), is = ink(sub, sub.textContent),
        ia = ink(by, "BRIAN ENO and PETER SCHMIDT"), iff = ink(fine, fine.textContent);
    var Bt = base(title), Bs = base(sub), Ba = base(by), Bf = base(fine);
    var gap1 = (Ba - ia.up) - (Bs + is.down);    // subtitle to names
    var gap2 = (Bf - iff.up) - (Ba + ia.down);   // names to copyright
    fine.style.marginTop = (parseFloat(getComputedStyle(fine).marginTop) + gap1 - gap2) + "px";
    Bf += gap1 - gap2;
    var top = Bt - it.up;                                  // card top to top of title letters
    var bottom = H - (Bf + iff.down);                      // bottom of copyright to card bottom
    card.style.paddingTop = (parseFloat(getComputedStyle(card).paddingTop) + (bottom - top) / 2) + "px";
  }

  // Show the current card, the next card peeking underneath, and the pile height.
  var tilt = 0;
  function render() {
    var intro = !single && pos < 0;
    var remaining = single ? TOTAL - 1 : TOTAL - 1 - pos;
    card.classList.toggle("intro", intro);
    if (intro) {
      textEl.innerHTML = INTRO_HTML;
      numEl.textContent = "";
    } else {
      card.style.paddingTop = "";
      var idx = single ? singleIdx : deck[pos];
      textEl.textContent = STRATEGIES[idx];
      // The number is the card's own number from the PDF.
      numEl.textContent = (idx + 1) + "/" + TOTAL;
      if (!single) setHash(idx + 1);
    }
    if (intro) setHash(0);
    tilt = sign() * rand(0.4, 1.6);
    card.style.setProperty("--tilt", tilt.toFixed(2) + "deg");
    card.style.setProperty("--land", (sign() * rand(0.3, 0.8)).toFixed(2) + "deg");
    // The pile loses layers from the TOP; the bottom of the pile never moves.
    depth = Math.min(MAX_LAYERS, remaining * MAX_LAYERS / (TOTAL - 1));
    var visible = Math.ceil(depth - 1e-6);
    topIdx = MAX_LAYERS - visible;
    visibleLayers = visible;
    fitPile();
    layers.forEach(function (l, i) { l.el.classList.toggle("gone", i < topIdx); });
    if (visible > 0) placePeek(topIdx, STRATEGIES[deck[intro || single ? 0 : pos + 1]]);
    else peekEl.textContent = "";
  }
  render();

  function xf(dx, dy, rot) {
    return "translate(" + dx.toFixed(1) + "px," + dy.toFixed(1) + "px) rotate(" + rot.toFixed(2) + "deg)";
  }
  function dragXf(dx, dy) { return xf(dx, dy, tilt + clamp(dx / 16, -20, 20)); }

  // Throw the top card away in direction (ux, uy). The next card is the one under it.
  function draw(ux, uy, startTransform) {
    if (ended) return;
    if (single) {                        // thrown away a shared card: carry on with the deck
      single = false; document.body.classList.remove("single");
      shuffle(); pos = -1;
    }
    var len = Math.hypot(ux, uy) || 1; ux /= len; uy /= len;

    if (!reduced) {
      var flyer = card.cloneNode(true);
      flyer.classList.add("flyer");
      flyer.removeAttribute("id");
      flyer.removeAttribute("tabindex");
      flyer.removeAttribute("role");
      flyer.removeAttribute("title");
      flyer.setAttribute("aria-hidden", "true");
      flyer.querySelector("h1").removeAttribute("id");
      flyer.style.cssText += ";animation:none;transition:none;position:absolute;inset:0;z-index:10;pointer-events:none;transform:" + (startTransform || xf(0, 0, tilt));
      flyer.style.top = card.style.getPropertyValue("--drop") || "0px";
      stack.appendChild(flyer);
      requestAnimationFrame(function () {
        requestAnimationFrame(function () {
          flyer.style.transition = "transform 440ms cubic-bezier(.3,.05,.6,1)";
          flyer.style.transform = xf(ux * 1400, uy * 1400, (ux >= 0 ? 1 : -1) * 45);
        });
      });
      setTimeout(function () { flyer.remove(); }, 520);
    }

    if (pos + 1 >= TOTAL) { finale(); return; }   // that was the last card
    var from = layers[Math.min(topIdx, MAX_LAYERS - 1)];   // the layer this card will be lifted from
    pos++;
    card.style.transition = "none";
    card.style.transform = "";
    render();
    if (!reduced && card.animate) {
      // The card that was peeking underneath lifts into place from its spot in the pile.
      var p = from, dropNow = parseFloat(card.style.getPropertyValue("--drop")) || 0;
      card.animate(
        [{ transform: xf(p.dx * scale, p.dy * scale - dropNow, p.rot) },
         { transform: "rotate(" + tilt + "deg)" }],
        { duration: 360, easing: "cubic-bezier(.2,.8,.25,1)" }
      );
    }
  }

  // ---- Finale: a bare table with just the header, then a chime. Tap to start over. ----
  var ended = false, canRestart = false, audioCtx = null;

  function unlockAudio() {          // must run inside the user's gesture (Safari, iOS)
    try {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      audioCtx = audioCtx || new AC();
      if (audioCtx.state === "suspended") audioCtx.resume();
    } catch (e) {}
  }

  // Browsers only allow sound after a tap or key press, and iOS is strict about which events
  // count, so wake the audio engine on the first of any of them, long before the finale.
  ["pointerdown", "touchend", "click", "keydown"].forEach(function (ev) {
    document.addEventListener(ev, unlockAudio, { passive: true });
  });

  // A short original chime, used when there is no startup.mp3 next to the page.
  function synthChime(done) {
    var ctx = audioCtx, t0 = ctx.currentTime + 0.05;
    var master = ctx.createGain(); master.gain.value = 0.5; master.connect(ctx.destination);
    var echo = ctx.createDelay(1); echo.delayTime.value = 0.31;
    var fb = ctx.createGain(); fb.gain.value = 0.36;
    var lp = ctx.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 2400;
    echo.connect(lp); lp.connect(fb); fb.connect(echo); lp.connect(master);
    function tone(freq, at, dur, vol) {
      [[1, "sine", 1], [2, "triangle", 0.18], [3, "sine", 0.05]].forEach(function (p) {
        var o = ctx.createOscillator(), g = ctx.createGain();
        o.type = p[1]; o.frequency.value = freq * p[0];
        var v = vol * p[2], t = t0 + at;
        g.gain.setValueAtTime(0.0001, t);
        g.gain.linearRampToValueAtTime(v, t + 0.06);
        g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        o.connect(g); g.connect(master); g.connect(echo);
        o.start(t); o.stop(t + dur + 0.1);
      });
    }
    tone(110.0, 0.0, 4.6, 0.20);   // low A
    tone(329.63, 0.0, 2.4, 0.22);  // E
    tone(440.0, 0.5, 2.4, 0.20);   // A
    tone(554.37, 1.0, 2.4, 0.18);  // C#
    tone(659.25, 1.5, 2.6, 0.17);  // E
    tone(880.0, 2.1, 3.0, 0.16);   // A
    tone(1108.7, 2.1, 3.0, 0.07);  // C#
    setTimeout(done, 5400);
  }

  function playFinale(done) {
    if (!audioCtx) { setTimeout(done, 1500); return; }
    // If you add your own startup.mp3 beside index.html, it is played instead.
    fetch("startup.mp3")
      .then(function (r) { if (!r.ok) throw new Error("none"); return r.arrayBuffer(); })
      .then(function (b) { return new Promise(function (res, rej) { audioCtx.decodeAudioData(b, res, rej); }); })
      .then(function (buf) {
        var src = audioCtx.createBufferSource();
        src.buffer = buf; src.connect(audioCtx.destination); src.onended = done; src.start();
        setTimeout(done, buf.duration * 1000 + 1500);   // safety net
      })
      .catch(function () { try { synthChime(done); } catch (e) { setTimeout(done, 1500); } });
  }

  var finaleRun = 0, lastRestart = 0;
  function finale() {
    var run = ++finaleRun;
    ended = true; canRestart = false;
    unlockAudio();
    numEl.textContent = "";
    setHash(0);
    document.body.classList.add("ended");
    setTimeout(function () {
      if (run !== finaleRun) return;          // started over before the chime began
      var finished = false;
      playFinale(function () {
        if (finished || run !== finaleRun) return; finished = true;
        canRestart = true;
      });
    }, 1500);
  }

  function restart() {
    lastRestart = Date.now();
    finaleRun++;                              // cancels a finale that is still in progress
    if (audioCtx) { try { audioCtx.close(); } catch (e) {} audioCtx = null; }
    ended = false; canRestart = false; single = false;
    document.body.classList.remove("ended", "single");
    shuffle(); pos = -1;
    card.style.transition = "none"; card.style.transform = "";
    render();
    if (!reduced && card.animate) {
      card.animate([{ transform: "translateY(-14px) rotate(" + (tilt + 0.6) + "deg)", opacity: 0 },
                    { transform: "rotate(" + tilt + "deg)", opacity: 1 }],
                   { duration: 420, easing: "cubic-bezier(.2,.8,.25,1)" });
    }
  }
  function showSingle(i) {            // arrive on a card's own link
    finaleRun++; ended = false; canRestart = false;
    single = true; singleIdx = i;
    document.body.classList.remove("ended");
    document.body.classList.add("single");
    card.style.transition = "none"; card.style.transform = "";
    render();
    if (!reduced && card.animate) {
      card.animate([{ transform: "translateY(-14px) rotate(" + (tilt + 0.6) + "deg)", opacity: 0 },
                    { transform: "rotate(" + tilt + "deg)", opacity: 1 }],
                   { duration: 420, easing: "cubic-bezier(.2,.8,.25,1)" });
    }
  }
  window.addEventListener("hashchange", function () {   // a different card's link pasted into this tab
    var n = hashNum();
    if (n) showSingle(n - 1);
    else if (single) restart();
  });

  // Tap the card number to copy that card's link.
  function legacyCopy(url, done) {
    var ta = document.createElement("textarea"), ok = false;
    ta.value = url; ta.style.cssText = "position:fixed;opacity:0";
    document.body.appendChild(ta); ta.select();
    try { ok = document.execCommand("copy"); } catch (e) {}
    ta.remove(); done(ok);
  }
  numEl.addEventListener("click", function () {
    var n = numEl.textContent.split("/")[0];
    if (!/^\d+$/.test(n)) return;
    var url = location.href.split("#")[0] + "#" + n, was = numEl.textContent;
    var done = function (ok) {
      var msg = ok ? "Link copied" : url;
      numEl.textContent = msg;
      setTimeout(function () { if (numEl.textContent === msg) numEl.textContent = was; }, 1800);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(url).then(function () { done(true); }, function () { legacyCopy(url, done); });
    } else legacyCopy(url, done);
  });

  function maybeRestart(e) { if (ended && canRestart) { e.preventDefault(); restart(); return true; } return false; }
  document.addEventListener("pointerdown", maybeRestart, true);

  // The page title is a "start over" button.
  var titleEl = document.getElementById("title");
  function startOver() {
    titleEl.blur();                           // so space and enter go back to drawing cards
    if (Date.now() - lastRestart > 400) restart();
  }
  titleEl.addEventListener("click", startOver);
  titleEl.addEventListener("keydown", function (e) {
    if (e.key === "Enter" || e.key === " ") { e.preventDefault(); e.stopPropagation(); startOver(); }
  });

  function springBack() {
    card.style.transition = reduced ? "none" : "transform 340ms cubic-bezier(.2,1.3,.4,1)";
    card.style.transform = xf(0, 0, tilt);
  }

  // Pointer drag, works for mouse, touch and pen.
  var drag = null;
  card.addEventListener("pointerdown", function (e) {
    if (e.button || ended) return;
    card.setPointerCapture(e.pointerId);
    var now = performance.now();
    drag = { id: e.pointerId, x0: e.clientX, y0: e.clientY, dx: 0, dy: 0, max: 0, pts: [{ x: e.clientX, y: e.clientY, t: now }] };
    card.style.transition = "none";
  });
  card.addEventListener("pointermove", function (e) {
    if (!drag || e.pointerId !== drag.id) return;
    drag.dx = e.clientX - drag.x0;
    drag.dy = e.clientY - drag.y0;
    drag.max = Math.max(drag.max, Math.hypot(drag.dx, drag.dy));
    var now = performance.now();
    drag.pts.push({ x: e.clientX, y: e.clientY, t: now });
    while (drag.pts.length > 2 && now - drag.pts[0].t > 100) drag.pts.shift();
    card.style.transform = dragXf(drag.dx, drag.dy);
  });
  function release(e, cancelled) {
    if (!drag || e.pointerId !== drag.id) return;
    var d = drag; drag = null;
    var dist = Math.hypot(d.dx, d.dy);
    var a = d.pts[0], b = d.pts[d.pts.length - 1];
    var dt = Math.max(b.t - a.t, 1);
    var vx = (b.x - a.x) / dt, vy = (b.y - a.y) / dt;
    var speed = Math.hypot(vx, vy);
    if (cancelled) { springBack(); return; }
    if (d.max < 6) { draw(sign() * 0.9, -0.45); return; } // a tap
    if (dist > 110 || speed > 0.55) {
      if (speed > 0.3) draw(vx, vy, dragXf(d.dx, d.dy));
      else draw(d.dx, d.dy, dragXf(d.dx, d.dy));
    } else {
      springBack();
    }
  }
  card.addEventListener("pointerup", function (e) { release(e, false); });
  card.addEventListener("pointercancel", function (e) { release(e, true); });

  // Keyboard: space, enter or the arrow keys draw a card.
  var keyDir = { ArrowRight: [1, -0.2], ArrowLeft: [-1, -0.2], ArrowUp: [0, -1], ArrowDown: [0, 1] };
  document.addEventListener("keydown", function (e) {
    if (e.metaKey || e.ctrlKey || e.altKey || e.target === titleEl) return;
    if (ended) { if (canRestart) { e.preventDefault(); restart(); } return; }
    var d = keyDir[e.key];
    if (!d && (e.key === " " || e.key === "Enter")) d = [sign() * 0.9, -0.45];
    if (!d) return;
    e.preventDefault();
    draw(d[0], d[1]);
  });
</script>
</body>
</html>
