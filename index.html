<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Oblique Strategies</title>
<meta name="description" content="A random Oblique Strategy on every page load.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400&display=block" rel="stylesheet">
<style>
  :root {
    --table: #a4a3a1;
    --card: #f5f4f1;
    --ink: #333333;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overscroll-behavior: none; }
  body {
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
  }
  ::selection { background: transparent; }
  body { min-height: 100vh; min-height: 100dvh; }

  body {
    background: var(--table);
    background-image: radial-gradient(120% 90% at 50% 30%, #b3b2b0, #8e8d8b);
    color: var(--ink);
    font-family: "Helvetica Neue", "Inter", Helvetica, Arial, sans-serif;
    font-kerning: normal;
    font-feature-settings: "kern" 1, "liga" 1, "calt" 1;
    text-rendering: optimizeLegibility;
    -webkit-font-smoothing: antialiased;
    display: grid;
    place-items: center;
    padding: 24px;
  }

  .stack { width: min(100%, 640px); }

  /* Card: plain stock, rounded corners, small centered sans text */
  .stack { position: relative; }
  .card { cursor: grab; touch-action: none; -webkit-user-drag: none; }
  .card:active { cursor: grabbing; }

  /* Paper: one soft shadow and a faint edge highlight */
  .card, .sheet {
    aspect-ratio: 3 / 2;
    background: linear-gradient(160deg, #fbfaf7 0%, var(--card) 60%, #ebeae6 100%);
    border-radius: clamp(14px, 3vw, 22px);
    box-shadow: 0 1px 0 #fff inset, 0 6px 14px -4px #14141159;
  }
  .card {
    position: relative;
    z-index: 4;
    display: grid;
    place-items: center;
    padding: clamp(24px, 7vw, 64px);
    user-select: none;
  }

  /* Cards waiting underneath. Offsets are randomised per load in the script. */
  .sheet {
    position: absolute;
    inset: 0;
    transform: translate(var(--dx, 0px), var(--dy, 0px)) rotate(var(--rot, 0deg));
    animation: fan 520ms cubic-bezier(.2, .8, .25, 1) backwards;
    transition: transform 450ms cubic-bezier(.2, .8, .25, 1);
  }
  .s1 { z-index: 3; animation-delay: 60ms; }
  .s2 { z-index: 2; animation-delay: 110ms; }
  .s3 { z-index: 1; animation-delay: 160ms; }

  .card {
    transform: rotate(var(--tilt, 0deg));
    animation: land 380ms cubic-bezier(.2, .8, .25, 1) backwards;
  }

  @keyframes fan {
    from { transform: translate(0, 0) rotate(0deg); }
  }
  @keyframes land {
    from { transform: translateY(-14px) rotate(calc(var(--tilt, 0deg) + var(--land, .6deg))); }
  }
  @media (prefers-reduced-motion: reduce) {
    .sheet, .card { animation: none; transition: none; }
  }

  h1 {
    position: relative;
    z-index: 1;
    font-weight: 400;
    font-size: clamp(1.45rem, 4vw, 2.25rem);
    line-height: 1.3;
    letter-spacing: -0.01em;
    font-kerning: normal;
    font-variant-ligatures: common-ligatures;
    font-feature-settings: "kern" 1, "liga" 1;
    text-align: center;
    text-wrap: balance;
    max-width: 26ch;
  }

  /* Position in the deck, centred at the very bottom */
  #num {
    position: fixed;
    left: 0;
    right: 0;
    bottom: max(20px, env(safe-area-inset-bottom));
    text-align: center;
    font-size: 14px;
    letter-spacing: 0.02em;
    font-feature-settings: "tnum" 1, "kern" 1;
    color: #4d4c4a;
    pointer-events: none;
  }
</style>
</head>
<body>
  <div class="stack">
    <div class="sheet s3"></div><div class="sheet s2"></div><div class="sheet s1"></div>
    <div class="card" id="card" role="button" tabindex="0" aria-label="Draw the next card" title="Drag, flick or tap to draw"><h1 id="strategy" aria-live="polite"></h1></div>
    <span id="num"></span>
  </div>

<script>
  // Source: "Visual Arts: Oblique Strategies Dartboard" (147 statements).
  const STRATEGIES = [
    "A line has two sides",
    "A very small object. Its center",
    "Abandon desire",
    "Abandon normal instructions",
    "Accept advice",
    "Adding on",
    "Always give yourself credit for having more than personality",
    "Always the first steps",
    "Ask people to work against their better judgement",
    "Ask your body",
    "Balance the consistency principle with the inconsistency principle",
    "Be dirty",
    "Be extravagant",
    "Be less critical",
    "Breathe more deeply",
    "Bridges - build - burn",
    "Cascades",
    "Change ambiguities to specifics",
    "Change instrument roles",
    "Change nothing and continue consistently",
    "Change specifics to ambiguities",
    "Children - speaking - singing",
    "Cluster analysis",
    "Consider different fading systems",
    "Consider transitions",
    "Consult other sources - promising - unpromising",
    "Convert a melodic element into a rhythmic element",
    "Courage!",
    "Cut a vital connection",
    "Decorate, decorate",
    "Destroy nothing; Destroy the most important thing",
    "Discard an axiom",
    "Disciplined self-indulgence",
    "Discover your formulas and abandon them",
    "Display your talent",
    "Distort time",
    "Do nothing for as long as possible",
    "Do something boring",
    "Do something sudden, destructive and unpredictable",
    "Do the last thing first",
    "Do the washing up",
    "Do the words need changing?",
    "Do we need holes?",
    "Don't avoid what is easy",
    "Don't break the silence",
    "Don't stress one thing more than another",
    "Emphasize differences",
    "Emphasize repetitions",
    "Emphasize the flaws",
    "Faced with a choice, do both",
    "Feed the recording back out of the medium",
    "Fill every beat with something",
    "Find a safe part and use it as an anchor",
    "From nothing to more than nothing",
    "Get your neck massaged",
    "Ghost echoes",
    "Give the name away",
    "Give way to your worst impulse",
    "Go outside. Shut the door.",
    "Go slowly all the way round the outside",
    "Go to an extreme, come part way back",
    "How would someone else do it?",
    "How would you have done it?",
    "Idiot glee",
    "Imagine the piece as a set of disconnected events",
    "In total darkness, or in a very large room, very quietly",
    "Infinitesimal gradations",
    "Intentions - nobility of - humility of - credibility of",
    "Into the impossible",
    "Is it finished?",
    "Is something missing?",
    "Is the intonation correct?",
    "Is the style right?",
    "It is quite possible (after all)",
    "It is simply a matter of work",
    "Just carry on",
    "Left channel, right channel, center channel",
    "Listen to the quiet voice",
    "Look at the order in which you do things",
    "Lost in useless territory",
    "Lowest common denominator",
    "Magnify the most difficult details",
    "Make a blank valuable by putting it in an exquisite frame",
    "Make it more sensual",
    "Make what's perfect more human",
    "Mechanize something idiosyncratic",
    "Move towards the unimportant",
    "Mute and continue",
    "Not building a wall; making a brick",
    "Once the search has begun, something will be found",
    "Only a part, not the whole",
    "Only one element of each kind",
    "Openly resist change",
    "(Organic) machinery",
    "Put in earplugs",
    "Question the heroic",
    "Reevaluation (a warm feeling)",
    "Remember quiet evenings",
    "Remove a restriction",
    "Repetition is a form of change",
    "Retrace your steps",
    "Reverse",
    "Short circuit (example: a man eating peas with the idea that they will improve his virility shovels them straight into his lap)",
    "Simple subtraction",
    "Slow preparation, fast execution",
    "Spectrum analysis",
    "State the problem as clearly as possible",
    "Take a break",
    "Take away the important parts",
    "Tape your mouth",
    "The inconsistency principle",
    "The most easily forgotten thing is the most important",
    "The tape is now the music",
    "Think - inside the work - outside the work",
    "Think of the radio",
    "Tidy up",
    "Trust in the you of now",
    "Try faking it",
    "Turn it upside down",
    "Twist the spine",
    "Use “unqualified” people",
    "Use an old idea",
    "Use an unacceptable color",
    "Use cliches",
    "Use fewer notes",
    "Use filters",
    "Use something nearby as a model",
    "Use your own ideas",
    "Voice your suspicions",
    "Water",
    "What are the sections sections of? Imagine a caterpillar moving",
    "What are you really thinking about just now?",
    "What context would look right?",
    "What is the reality of the situation?",
    "What is the simplest solution?",
    "What mistakes did you make last time?",
    "What to increase? What to reduce? What to maintain?",
    "What would your closest friend do?",
    "What wouldn't you do?",
    "When is it for?",
    "Where is the edge?",
    "Which parts can be grouped?",
    "Work at a different speed",
    "Would anyone want it?",
    "You are an engineer",
    "You can only make one dot at a time",
    "Your mistake was a hidden intention"
  ];

  var TOTAL = STRATEGIES.length;
  var reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var card = document.getElementById("card");
  var stack = document.querySelector(".stack");
  var textEl = document.getElementById("strategy");
  var numEl = document.getElementById("num");
  var sheets = ["s1", "s2", "s3"].map(function (c) { return document.querySelector(".sheet." + c); });

  var rand = function (a, b) { return a + Math.random() * (b - a); };
  var sign = function () { return Math.random() < 0.5 ? -1 : 1; };
  var clamp = function (v, a, b) { return Math.max(a, Math.min(b, v)); };

  // Shuffled deck: every card appears once before any repeats.
  var deck = [], pos = 0;
  function shuffle(avoidFirst) {
    deck = STRATEGIES.map(function (_, i) { return i; });
    for (var i = deck.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1)), t = deck[i];
      deck[i] = deck[j]; deck[j] = t;
    }
    if (avoidFirst !== undefined && deck[0] === avoidFirst && deck.length > 1) {
      var k = deck.length - 1, t2 = deck[0];
      deck[0] = deck[k]; deck[k] = t2;
    }
    pos = 0;
  }
  shuffle();

  // Show the current card and give the pile a slightly new shape.
  var tilt = 0;
  function render() {
    textEl.textContent = STRATEGIES[deck[pos]];
    numEl.textContent = (pos + 1) + "/" + TOTAL;
    tilt = sign() * rand(0.4, 1.6);
    card.style.setProperty("--tilt", tilt.toFixed(2) + "deg");
    card.style.setProperty("--land", (sign() * rand(0.3, 0.8)).toFixed(2) + "deg");
    var s = sign();
    sheets.forEach(function (el, i) {
      s = -s; // alternate sides so the pile stays believable
      el.style.setProperty("--dx", (sign() * rand(1, 3 + i * 2)).toFixed(1) + "px");
      el.style.setProperty("--dy", (8 + i * 8 + rand(-2, 3)).toFixed(1) + "px");
      el.style.setProperty("--rot", (s * rand(0.4, 0.9 + i * 0.5)).toFixed(2) + "deg");
    });
  }
  render();

  function xf(dx, dy, rot) {
    return "translate(" + dx.toFixed(1) + "px," + dy.toFixed(1) + "px) rotate(" + rot.toFixed(2) + "deg)";
  }
  function dragXf(dx, dy) { return xf(dx, dy, tilt + clamp(dx / 16, -20, 20)); }

  // Throw the top card away in direction (ux, uy); the next card is already underneath.
  function draw(ux, uy, startTransform) {
    var len = Math.hypot(ux, uy) || 1; ux /= len; uy /= len;

    if (!reduced) {
      var flyer = card.cloneNode(true);
      flyer.removeAttribute("id");
      flyer.removeAttribute("tabindex");
      flyer.removeAttribute("role");
      flyer.removeAttribute("title");
      flyer.setAttribute("aria-hidden", "true");
      flyer.querySelector("h1").removeAttribute("id");
      flyer.style.cssText += ";animation:none;transition:none;position:absolute;inset:0;z-index:10;pointer-events:none;transform:" + (startTransform || xf(0, 0, tilt));
      stack.appendChild(flyer);
      requestAnimationFrame(function () {
        requestAnimationFrame(function () {
          flyer.style.transition = "transform 440ms cubic-bezier(.3,.05,.6,1)";
          flyer.style.transform = xf(ux * 1400, uy * 1400, (ux >= 0 ? 1 : -1) * 45);
        });
      });
      setTimeout(function () { flyer.remove(); }, 520);
    }

    var last = deck[pos];
    pos++;
    if (pos >= TOTAL) shuffle(last);
    card.style.transition = "none";
    card.style.transform = "";
    render();
    if (!reduced && card.animate) {
      card.animate(
        [{ transform: "translateY(8px) scale(.985) rotate(" + tilt + "deg)" },
         { transform: "rotate(" + tilt + "deg)" }],
        { duration: 340, easing: "cubic-bezier(.2,.8,.25,1)" }
      );
    }
  }

  function springBack() {
    card.style.transition = reduced ? "none" : "transform 340ms cubic-bezier(.2,1.3,.4,1)";
    card.style.transform = xf(0, 0, tilt);
  }

  // Pointer drag, works for mouse, touch and pen.
  var drag = null;
  card.addEventListener("pointerdown", function (e) {
    if (e.button) return;
    card.setPointerCapture(e.pointerId);
    var now = performance.now();
    drag = { id: e.pointerId, x0: e.clientX, y0: e.clientY, dx: 0, dy: 0, pts: [{ x: e.clientX, y: e.clientY, t: now }] };
    card.style.transition = "none";
  });
  card.addEventListener("pointermove", function (e) {
    if (!drag || e.pointerId !== drag.id) return;
    drag.dx = e.clientX - drag.x0;
    drag.dy = e.clientY - drag.y0;
    var now = performance.now();
    drag.pts.push({ x: e.clientX, y: e.clientY, t: now });
    while (drag.pts.length > 2 && now - drag.pts[0].t > 100) drag.pts.shift();
    card.style.transform = dragXf(drag.dx, drag.dy);
  });
  function release(e, cancelled) {
    if (!drag || e.pointerId !== drag.id) return;
    var d = drag; drag = null;
    var dist = Math.hypot(d.dx, d.dy);
    var a = d.pts[0], b = d.pts[d.pts.length - 1];
    var dt = Math.max(b.t - a.t, 1);
    var vx = (b.x - a.x) / dt, vy = (b.y - a.y) / dt;
    var speed = Math.hypot(vx, vy);
    if (cancelled) { springBack(); return; }
    if (dist < 6) { draw(sign() * 0.9, -0.45); return; } // a tap
    if (dist > 110 || speed > 0.55) {
      if (speed > 0.3) draw(vx, vy, dragXf(d.dx, d.dy));
      else draw(d.dx, d.dy, dragXf(d.dx, d.dy));
    } else {
      springBack();
    }
  }
  card.addEventListener("pointerup", function (e) { release(e, false); });
  card.addEventListener("pointercancel", function (e) { release(e, true); });

  // Keyboard: space, enter or the arrow keys draw a card.
  var keyDir = { ArrowRight: [1, -0.2], ArrowLeft: [-1, -0.2], ArrowUp: [0, -1], ArrowDown: [0, 1] };
  document.addEventListener("keydown", function (e) {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    var d = keyDir[e.key];
    if (!d && (e.key === " " || e.key === "Enter")) d = [sign() * 0.9, -0.45];
    if (!d) return;
    e.preventDefault();
    draw(d[0], d[1]);
  });
</script>
</body>
</html>
